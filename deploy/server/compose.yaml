# ── RCD VlogCutter Companion Server ──────────────────────────────────
#
# This Compose file runs the private server backend. TLS is terminated
# externally by one of two front doors:
#
#   LAN:  Caddy (Caddyfile in this directory) listens on rcdvlog.local:8443
#         and reverse-proxies to the loopback backend with a local CA cert.
#
#   WAN:  Tailscale Serve proxies the loopback backend with tailnet HTTPS.
#         See tailscale-setup.md for configuration steps.
#
# Both front doors set X-Forwarded-For / X-Forwarded-Proto / X-Forwarded-Host
# headers. The server only trusts these headers from 127.0.0.1/::1.
#
# Funnel is never configured and must not be enabled.

services:
  rcdvlog-server:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: rcdvlog-server:local
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 65s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      RCDVLOG_DATA_DIR: /var/lib/rcdvlog
      RCDVLOG_TEMP_DIR: /var/lib/rcdvlog/tmp
      RCDVLOG_DERIVED_DIR: /srv/rcdvlog/derived
      RCDVLOG_BACKUP_DIR: /srv/rcdvlog/backups
      RCDVLOG_ALLOWED_ORIGINAL_MOUNTS: /media/originals
      RCDVLOG_LISTEN_ADDR: 127.0.0.1:8090
      RCDVLOG_LAN_HOSTNAME: ${RCDVLOG_LAN_HOSTNAME:-rcdvlog.local}
      RCDVLOG_SHUTDOWN_TIMEOUT_SECONDS: ${RCDVLOG_SHUTDOWN_TIMEOUT_SECONDS:-10}
      RCDVLOG_BACKUP_INTERVAL_SECONDS: ${RCDVLOG_BACKUP_INTERVAL_SECONDS:-86400}
      RCDVLOG_BACKUP_DAILY_RETENTION: ${RCDVLOG_BACKUP_DAILY_RETENTION:-14}
      RCDVLOG_BACKUP_WEEKLY_RETENTION: ${RCDVLOG_BACKUP_WEEKLY_RETENTION:-8}
      RCDVLOG_MINIMUM_FREE_BYTES: ${RCDVLOG_MINIMUM_FREE_BYTES:-5368709120}
      RCDVLOG_PROXY_ENCODER_POLICY: ${RCDVLOG_PROXY_ENCODER_POLICY:-auto}
      RUST_LOG: ${RUST_LOG:-info}
    # Optional VAAPI acceleration. Uncomment both lines only when the host has
    # a usable render node and the container user has render/video access. A
    # failed probe reports the reason and auto falls back to software.
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - type: volume
        source: rcdvlog-state
        target: /var/lib/rcdvlog
      - type: bind
        source: ${RCDVLOG_DERIVED_HOST_PATH:-/srv/rcdvlog/derived}
        target: /srv/rcdvlog/derived
        bind:
          create_host_path: false
      - type: bind
        source: ${RCDVLOG_BACKUP_HOST_PATH:-/srv/rcdvlog/backups}
        target: /srv/rcdvlog/backups
        bind:
          create_host_path: false
      - type: bind
        source: ${RCDVLOG_ORIGINALS_HOST_PATH:-/mnt/rcdvlog/originals}
        target: /media/originals
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  rcdvlog-state:
    driver: local
