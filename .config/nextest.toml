# cargo-nextest configuration. CI pins the tool version in the workflow
# (NEXTEST_VERSION); see the CI notes in the workflows README.

[profile.default]
# A test running longer than `period` is reported as SLOW (named in the log);
# after `terminate-after` periods it is killed and reported as TIMEOUT, so a
# hung test fails by name in about period * terminate-after instead of
# stalling the job until GitHub cancels it. Nothing is skipped or retried.
slow-timeout = { period = "60s", terminate-after = 5 }
# Keep running after a failure so one run reports every failing test.
fail-fast = false

[profile.ci]
inherits = "default"
status-level = "slow"
final-status-level = "slow"
failure-output = "immediate-final"

[profile.ci.junit]
# Written under target/nextest/ci/; CI uploads it for per-test timings.
path = "junit.xml"
