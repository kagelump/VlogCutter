[package]
name = "rcdvlog-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rcdvlog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
keyring = { version = "3.6", features = ["apple-native", "sync-secret-service"] }
rand.workspace = true
rcdvlog-core = { path = "../../../core/rcdvlog-core" }
rcdvlog-sync = { path = "../../../core/rcdvlog-sync" }
rusqlite.workspace = true
http = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.10", features = ["protocol-asset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tokio-util.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-dialog = "2.6"
uuid.workspace = true

[dev-dependencies]
tempfile = "3.24"
