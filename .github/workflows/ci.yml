# Every gate step carries `if: ${{ !cancelled() }}` so that one red step
# reports one failure rather than hiding every later one. Before this, a
# formatting nit in `cargo fmt` skipped clippy, the whole test suite, both
# frontend suites and every docs check, and main stayed red for six days
# looking like a single trivial problem. Keep the guard on any gate added here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This workspace's debug `target/` is ~14 GB — whisper.cpp, the webkit2gtk
      # bindings, a bundled SQLite, axum and reqwest, built once per feature
      # resolution — which does not comfortably fit in the runner image's free
      # space. Reclaim the SDKs nothing here uses before anything writes to disk.
      # `/opt/hostedtoolcache` is deliberately untouched: Node lives there.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Prunes the target directory before saving, which plain `actions/cache`
      # cannot do — see the workflow README. `cache-on-failure` matters here
      # because every gate runs now: one red gate should not also cost the next
      # run its cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: pnpm check:frontend
        if: ${{ !cancelled() }}
        run: pnpm check:frontend

      - name: pnpm test:desktop
        if: ${{ !cancelled() }}
        run: pnpm test:desktop

      # The fast CUJ tier also runs inside `test:desktop` above. It has its own
      # step so a failure in the full-journey layer is legible at a glance
      # rather than buried among four hundred unit and component tests.
      - name: pnpm test:desktop:cuj
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:cuj

      # The desktop real-browser tier (issue #22) needs a Chromium and its
      # system libraries; the gate step below drives it through the Vite
      # preview. Kept as its own install so a browser-download failure is
      # legible rather than folded into the gate.
      - name: Install Playwright Chromium (desktop)
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium

      - name: pnpm test:desktop:browser
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:browser

      - name: pnpm test:web
        if: ${{ !cancelled() }}
        run: pnpm test:web

      - name: pnpm test:integration
        if: ${{ !cancelled() }}
        run: pnpm test:integration

      - name: pnpm check:openapi
        if: ${{ !cancelled() }}
        run: pnpm check:openapi

      - name: pnpm check:docs
        if: ${{ !cancelled() }}
        run: pnpm check:docs

      - name: pnpm check:deployment
        if: ${{ !cancelled() }}
        run: pnpm check:deployment

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      - name: Install system dependencies
        run: brew install ffmpeg

      # Prunes the target directory before saving, which plain `actions/cache`
      # cannot do — see the workflow README. `cache-on-failure` matters here
      # because every gate runs now: one red gate should not also cost the next
      # run its cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test -p rcdvlog-desktop
        run: cargo test -p rcdvlog-desktop

      - name: pnpm --dir apps/desktop tauri build
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/desktop tauri build
