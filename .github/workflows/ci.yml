name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: pnpm check:frontend
        run: pnpm check:frontend

      - name: pnpm test:desktop
        run: pnpm test:desktop

      - name: pnpm test:web
        run: pnpm test:web

      - name: pnpm test:integration
        run: pnpm test:integration

      - name: pnpm check:openapi
        run: pnpm check:openapi

      - name: pnpm check:docs
        run: pnpm check:docs

      - name: pnpm check:deployment
        run: pnpm check:deployment

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      - name: Install system dependencies
        run: brew install ffmpeg

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test -p rcdvlog-desktop
        run: cargo test -p rcdvlog-desktop

      - name: pnpm --dir apps/desktop tauri build
        run: pnpm --dir apps/desktop tauri build
