# Every gate step carries `if: ${{ !cancelled() }}` so that one red step
# reports one failure rather than hiding every later one. Before this, a
# formatting nit in `cargo fmt` skipped clippy, the whole test suite, both
# frontend suites and every docs check, and main stayed red for six days
# looking like a single trivial problem. Keep the guard on any gate added here.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Anyone can fork a public repository and open a pull request, so PR code is
# untrusted code. `pull_request` runs it with a token scoped to the fork and no
# access to this repository's secrets; `pull_request_target` would run the same
# code against the base repository's write-capable token, which is the one thing
# this workflow must never do. Keep the trigger, and keep the token read-only —
# nothing here writes to the repository, publishes a package, or posts a review.
permissions:
  contents: read

env:
  # Pinned deliberately. Following the `stable` channel left `main` red for six
  # days when a new release changed what `rustfmt` accepted, with no code change
  # to explain it. Raise this on purpose, in its own commit, after running the
  # gate locally on the new version; keep it in step with `AGENTS.md` §6.
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.17.0"

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      # Every action below is pinned to an immutable commit rather than a
      # moving tag: a tag can be repointed at new code by whoever owns it, and
      # a workflow that trusts one is running whatever that account decides to
      # publish. The trailing comment is the human-readable version, and is
      # what Dependabot rewrites when it proposes an upgrade — see
      # `.github/dependabot.yml`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # This workspace's debug `target/` is ~14 GB — whisper.cpp, the webkit2gtk
      # bindings, a bundled SQLite, axum and reqwest, built once per feature
      # resolution — which does not comfortably fit in the runner image's free
      # space. Reclaim the SDKs nothing here uses before anything writes to disk.
      # `/opt/hostedtoolcache` is deliberately untouched: Node lives there.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift || true
          df -h /

      # `components` is explicit because this pin installs a toolchain the
      # runner image does not already carry, under a minimal profile: without
      # it the first two gates below fail on a missing rustfmt and clippy.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # Prunes the target directory before saving, which plain `actions/cache`
      # cannot do — see the workflow README. `cache-on-failure` matters here
      # because every gate runs now: one red gate should not also cost the next
      # run its cache. A fork PR reads the base repository's cache and cannot
      # write to it, so nothing a fork builds is ever restored into a later run.
      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      - name: pnpm check:frontend
        if: ${{ !cancelled() }}
        run: pnpm check:frontend

      - name: pnpm test:desktop
        if: ${{ !cancelled() }}
        run: pnpm test:desktop

      # The fast CUJ tier also runs inside `test:desktop` above. It has its own
      # step so a failure in the full-journey layer is legible at a glance
      # rather than buried among four hundred unit and component tests.
      - name: pnpm test:desktop:cuj
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:cuj

      # The desktop real-browser tier (issue #22) needs a Chromium and its
      # system libraries; the gate step below drives it through the Vite
      # preview. Kept as its own install so a browser-download failure is
      # legible rather than folded into the gate.
      - name: Install Playwright Chromium (desktop)
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/desktop exec playwright install --with-deps chromium

      - name: pnpm test:desktop:browser
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:browser

      - name: pnpm test:web
        if: ${{ !cancelled() }}
        run: pnpm test:web

      - name: pnpm test:integration
        if: ${{ !cancelled() }}
        run: pnpm test:integration

      - name: pnpm check:openapi
        if: ${{ !cancelled() }}
        run: pnpm check:openapi

      - name: pnpm check:docs
        if: ${{ !cancelled() }}
        run: pnpm check:docs

      # The repository's own tooling — the docs checker and the eval-bridge
      # address resolution that the desktop harness and `pnpm eval` share.
      - name: pnpm test:scripts
        if: ${{ !cancelled() }}
        run: pnpm test:scripts

      - name: pnpm check:deployment
        if: ${{ !cancelled() }}
        run: pnpm check:deployment

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install system dependencies
        run: brew install ffmpeg

      # Prunes the target directory before saving, which plain `actions/cache`
      # cannot do — see the workflow README. `cache-on-failure` matters here
      # because every gate runs now: one red gate should not also cost the next
      # run its cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test -p rcdvlog-desktop
        run: cargo test -p rcdvlog-desktop

      - name: pnpm --dir apps/desktop tauri build
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/desktop tauri build
