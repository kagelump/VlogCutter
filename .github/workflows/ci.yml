name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

# Anyone can fork a public repository and open a pull request, so PR code is
# untrusted code. `pull_request` runs fork code with a read-only token and no
# access to this repository's secrets; `pull_request_target` would run the same
# code against the base repository's write-capable token, which is the one thing
# this workflow must never do. Keep the trigger, and keep the token read-only —
# nothing here writes to the repository, publishes a package, or posts a review.
permissions:
  contents: read

env:
  # Pinned deliberately. Following the `stable` channel left `main` red for six
  # days when a new release changed what `rustfmt` accepted, with no code change
  # to explain it. Raise this on purpose, in its own commit, after running the
  # gate locally on the new version; keep it in step with the `AGENTS.md` "Toolchain" section.
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.11.0"
  PNPM_VERSION: "10.17.0"
  # cargo-nextest runs the Rust tests; see .config/nextest.toml and
  # .github/workflows/README.md. scripts/ci-nextest.test.mjs keeps this and the
  # shard matrix below consistent.
  NEXTEST_VERSION: "0.9.151"

# Required check: ci-required. Never add workflow-level path filters.
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      macos: ${{ steps.platform.outputs.macos }}
      reason: ${{ steps.platform.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Classify macOS impact (fail closed)
        id: platform
        run: node scripts/ci-platform.mjs

  linux-rust:
    name: linux-rust (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `tests` is split into nextest `--partition count:SHARD/4` shards. The
        # job id stays `linux-rust`, so `ci-required` aggregates every shard:
        # any failed, cancelled or missing shard fails the whole job result.
        include:
          - gate: lint
            label: lint
          - gate: tests
            shard: 1
            label: tests 1/4
          - gate: tests
            shard: 2
            label: tests 2/4
          - gate: tests
            shard: 3
            label: tests 3/4
          - gate: tests
            shard: 4
            label: tests 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          df -h /
          available_kb=$(df -Pk / | awk 'NR == 2 {print $4}')
          if (( available_kb < 40 * 1024 * 1024 )); then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
              /usr/local/.ghcup /usr/local/share/boost /usr/share/swift
          fi
          df -h /
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install system dependencies (bounded)
        timeout-minutes: 5
        run: bash scripts/ci-linux-deps.sh
      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
          # Lint and tests produce different artifacts; avoid a first-writer
          # cache race. All test shards build the same artifacts, so they share
          # one key and only shard 1 saves it.
          key: ${{ matrix.gate }}
          save-if: ${{ matrix.gate == 'lint' || matrix.shard == 1 }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: cargo fmt --all -- --check
        if: ${{ !cancelled() && matrix.gate == 'lint' }}
        run: cargo fmt --all -- --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !cancelled() && matrix.gate == 'lint' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-nextest ${{ env.NEXTEST_VERSION }} (bounded)
        if: ${{ !cancelled() && matrix.gate == 'tests' }}
        timeout-minutes: 5
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}
      # Same check developers and the gate run; fails in seconds with the fix
      # instead of hundreds of opaque fixture failures. Lint never runs nextest.
      - name: Preflight (pinned toolchain and media tools)
        run: node scripts/dev-preflight.mjs ${{ matrix.gate == 'lint' && '--skip nextest' || '' }}
      - name: cargo nextest run --workspace (shard ${{ matrix.shard }}/4)
        if: ${{ !cancelled() && matrix.gate == 'tests' }}
        run: |
          nproc
          lscpu
          /usr/bin/time -v cargo nextest run --workspace --profile ci --test-threads 4 --partition count:${{ matrix.shard }}/4
      # nextest does not run doctests; run them once, on the first shard.
      - name: cargo test --workspace --doc
        if: ${{ !cancelled() && matrix.gate == 'tests' && matrix.shard == 1 }}
        run: cargo test --workspace --doc
      - name: pnpm check:openapi
        if: ${{ !cancelled() && matrix.gate == 'tests' && matrix.shard == 1 }}
        run: pnpm check:openapi
      - name: Upload nextest JUnit (per-test timings)
        if: ${{ !cancelled() && matrix.gate == 'tests' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm check:frontend
        if: ${{ !cancelled() }}
        run: pnpm check:frontend

      - name: pnpm test:desktop:coverage
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:coverage

      - name: pnpm test:web
        if: ${{ !cancelled() }}
        run: pnpm test:web

      - name: pnpm check:docs
        if: ${{ !cancelled() }}
        run: pnpm check:docs

      - name: pnpm test:scripts
        if: ${{ !cancelled() }}
        run: pnpm test:scripts

      - name: pnpm check:deployment
        if: ${{ !cancelled() }}
        run: pnpm check:deployment

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Match pnpm-lock.yaml; immutable Microsoft image includes browsers + OS libs.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: node scripts/ci-browser-image.mjs
        if: ${{ !cancelled() }}
        run: node scripts/ci-browser-image.mjs

      - name: pnpm test:desktop:browser
        if: ${{ !cancelled() }}
        run: pnpm test:desktop:browser

  # The real-server Chrome tier (`pnpm test:web:e2e`). It drives the actual
  # Axum server against a seeded fixture catalog, so it catches contract drift
  # that unit tests on either side cannot — #241 (a receipt compared by JSON key
  # order) passed every Vitest and Rust test and failed only here. Rust is built
  # once on a hosted runner; the browser half runs in the same pinned official
  # Playwright image as `browser`, which has no Rust toolchain.
  web-e2e-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Only the binaries are shipped to the browser job; full debug info would
      # multiply the artifact without helping a browser failure.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
          key: web-e2e
      - name: cargo build -p rcdvlog-server (server and e2e seed)
        run: |
          cargo build --locked -p rcdvlog-server --bin rcdvlog-server --example web_e2e_seed
          mkdir -p web-e2e-bin
          cp target/debug/rcdvlog-server target/debug/examples/web_e2e_seed web-e2e-bin/
          ls -l web-e2e-bin
      - name: Upload server binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-bin
          path: web-e2e-bin/
          retention-days: 1
          if-no-files-found: error

  web-e2e:
    needs: web-e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Same digest as `browser`; scripts/ci-browser-image.mjs checks both.
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Download server binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-e2e-bin
          path: ${{ runner.temp }}/web-e2e-bin
      - name: pnpm test:web:e2e
        env:
          RCDVLOG_WEB_E2E_SERVER_BIN: ${{ runner.temp }}/web-e2e-bin/rcdvlog-server
          RCDVLOG_WEB_E2E_SEED_BIN: ${{ runner.temp }}/web-e2e-bin/web_e2e_seed
        run: |
          chmod +x "$RCDVLOG_WEB_E2E_SERVER_BIN" "$RCDVLOG_WEB_E2E_SEED_BIN"
          pnpm test:web:e2e
      - name: Upload Playwright results
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-results
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  macos:
    needs: changes
    # A failed detector or absent output must run macOS, not silently skip it.
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Platform decision
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: echo "${REASON:-Change detection unavailable; running macOS}"
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install system dependencies (bounded)
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Preflight (pinned toolchain and media tools)
        run: node scripts/dev-preflight.mjs --skip nextest

      # Prunes the target directory before saving, which plain `actions/cache`
      # cannot do — see the workflow README. `cache-on-failure` matters here
      # because every gate runs now: one red gate should not also cost the next
      # run its cache.
      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test -p rcdvlog-desktop
        run: cargo test -p rcdvlog-desktop

      - name: pnpm --dir apps/desktop tauri build
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/desktop tauri build

  ci-required:
    if: ${{ always() }}
    needs: [changes, linux-rust, frontend, browser, web-e2e-build, web-e2e, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all required results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-required.mjs
